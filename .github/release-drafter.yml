name-template: 'v$RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'
change-template: '- $TITLE (#$NUMBER) @$AUTHOR'
template: |
  ## Changes

  $CHANGES

version-resolver:
  major:
    labels:
      - 'breaking'
  minor:
    labels:
      - 'feature'
      - 'enhancement'
  patch:
    labels:
      - 'bug'
      - 'fix'
      - 'dependencies'
  default: patch

categories:
  - title: 'Breaking Changes'
    labels:
      - 'breaking'
  - title: 'Features'
    labels:
      - 'feature'
      - 'enhancement'
  - title: 'Bug Fixes'
    labels:
      - 'bug'
      - 'fix'
  - title: 'Maintenance'
    labels:
      - 'chore'
      - 'dependencies'
      - 'documentation'

exclude-labels:
  - 'skip-changelog'

# Labels come from the conventional PR title (feat:, fix:, docs:, ...).
autolabeler:
  - label: 'breaking'
    title:
      - '/^\w+(\(.+\))?!:/'
  - label: 'feature'
    title:
      - '/^feat/i'
  - label: 'bug'
    title:
      - '/^fix/i'
  - label: 'documentation'
    title:
      - '/^docs/i'
  - label: 'chore'
    title:
      - '/^(chore|ci|build|refactor|test)/i'
  - label: 'dependencies'
    title:
      - '/^(deps|chore\(deps\))/i'

sort-by: 'merged_at'
sort-direction: 'descending'
